[package]
name = "dasdevbot-desktop"
version = "0.1.0"
edition = "2021"
description = "dasdevbot desktop shell. Reads the session bearer from disk, signs card-window decisions, and takes settings-window secret entry."
license = "UNLICENSED"
publish = false

[workspace]

[lib]
name = "dasdevbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The demo installer starts a loopback mock daemon sidecar. See tauri.demo.conf.json.
demo-daemon = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
dasdevbot-core = { path = "../../../crates/core" }
dasdevbotd = { path = "../../../crates/daemon", default-features = false }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
ureq = { version = "2", default-features = false, features = ["json"] }

# Snap Layouts overlay on the drawn maximize button (src/snap.rs). Already in
# Tauri's own dependency tree on Windows; MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
