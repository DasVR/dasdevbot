[package]
name = "dasdevbot-desktop"
version = "0.1.0"
edition = "2021"
description = "dasdevbot desktop shell. Reads the session bearer from disk, signs card-window decisions, and takes settings-window secret entry."
license = "UNLICENSED"
publish = false

[workspace]

[lib]
name = "dasdevbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The demo installer starts a loopback mock daemon sidecar. See tauri.demo.conf.json.
demo-daemon = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
dasdevbot-core = { path = "../../../crates/core" }
dasdevbotd = { path = "../../../crates/daemon", default-features = false }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
ureq = { version = "2", default-features = false, features = ["json"] }
