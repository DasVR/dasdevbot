[package]
name = "dasdevbot-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local iroh endpoint. No peers in phase 0."

[features]
default = ["p2p"]
p2p = ["dep:iroh", "dep:tokio"]

[dependencies]
# Default iroh features (tls-ring, metrics, portmapper). The size budget is for this stack.
iroh = { version = "1.3.0", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
