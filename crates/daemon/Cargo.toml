[package]
name = "dasdevbotd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "dasdevbot daemon. Same binary for every node role."

[features]
default = ["p2p"]
p2p = ["dasdevbot-sync/p2p"]

[lib]
name = "dasdevbotd"
path = "src/lib.rs"

[[bin]]
name = "dasdevbotd"
path = "src/main.rs"

[dependencies]
dasdevbot-core = { path = "../core" }
dasdevbot-proto = { path = "../proto" }
dasdevbot-sync = { path = "../sync", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
subtle = "2"
sha2 = "0.10"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
libc = "0.2"
rpassword = "7"
thiserror = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
ed25519-dalek = "3"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Security_Cryptography_Core",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
windows-future = "0.2"
